<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .chat-container {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 700px;
    background: #fff;
    display: flex;
    flex-direction: column;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,.12);
  }

  .chat-header {
    padding: 16px 20px;
    background: #1a1a1a;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 18px;
    line-height: 1.5;
    font-size: 14px;
    word-break: break-word;
  }

  .msg.user {
    align-self: flex-end;
    background: #1a1a1a;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg.bot {
    align-self: flex-start;
    background: #f0f0f0;
    color: #1a1a1a;
    border-bottom-left-radius: 4px;
  }

  .msg.bot.streaming::after {
    content: "▋";
    animation: blink .7s step-start infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .chat-input-area {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #eee;
    background: #fff;
  }

  .chat-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ddd;
    border-radius: 22px;
    font-size: 14px;
    outline: none;
    resize: none;
    height: 42px;
    line-height: 22px;
  }

  .chat-input:focus { border-color: #1a1a1a; }

  .send-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #1a1a1a;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .send-btn:disabled { background: #ccc; cursor: default; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">和我聊聊</div>
  <div class="chat-messages" id="messages">
    <div class="msg bot">你好，我是网站主人。有什么想聊的？</div>
  </div>
  <div class="chat-input-area">
    <textarea
      class="chat-input"
      id="input"
      placeholder="发消息…"
      rows="1"
    ></textarea>
    <button class="send-btn" id="sendBtn">↑</button>
  </div>
</div>

<script>
  // 修改这里为你的服务器地址
  const API = "https://47.108.56.88/api/chat";
  const SESSION = "sess_" + Math.random().toString(36).slice(2);

  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("input");
  const sendBtn    = document.getElementById("sendBtn");

  function appendMsg(role, text) {
    const el = document.createElement("div");
    el.className = `msg ${role}`;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    inputEl.value = "";
    sendBtn.disabled = true;
    appendMsg("user", text);

    const botEl = appendMsg("bot", "");
    botEl.classList.add("streaming");

    try {
      const resp = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: SESSION }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        const lines = buf.split("\n");
        buf = lines.pop();

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const payload = line.slice(6).trim();
          if (payload === "[DONE]") break;
          try {
            const parsed = JSON.parse(payload);
            if (parsed.text) {
              botEl.textContent += parsed.text;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            } else if (parsed.error) {
              botEl.textContent = "出错了，请稍后再试。";
            }
          } catch {}
        }
      }
    } catch (e) {
      botEl.textContent = "连接失败，请稍后再试。";
    } finally {
      botEl.classList.remove("streaming");
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
</script>
</body>
</html>
